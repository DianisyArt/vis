<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Фото-просмотр 360°: панорамы Cycles; нажатие на дверцу накладывает её отрендеренную «заплатку»; 3D-режим — отдельная страница */
:root {
  --bg: #e9e4dc; --panel: rgba(250, 247, 242, 0.9); --ink: #2b2723; --muted: #6e665c; --line: rgba(43, 39, 35, 0.14);

  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1b19; --panel: rgba(32, 30, 27, 0.88); --ink: #efe9e1; --muted: #a79d90; --line: rgba(239, 233, 225, 0.14);
  --gold: #c9a35c; --gold-ink: #1d1b19; --scene: #2a2723; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1d1b19; --panel: rgba(32, 30, 27, 0.88); --ink: #efe9e1; --muted: #a79d90; --line: rgba(239, 233, 225, 0.14);
  --gold: #c9a35c; --gold-ink: #1d1b19; --scene: #2a2723; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--scene); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#c:active { cursor: grabbing; }
.top { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 340px; }
.card h1 { font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 0 0 3px; }
.card p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.btn, .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 13px var(--f-body); border-radius: 999px; padding: 8px 13px; cursor: pointer; white-space: nowrap;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.link { pointer-events: auto; }
.bottom { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; padding: 2px; pointer-events: auto; }
.row::-webkit-scrollbar { display: none; }
.chip[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip[aria-pressed="true"] .dot { background: var(--gold); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: auto; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--f-body); padding: 7px 13px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px;
  font-size: 13.5px; color: var(--ink); pointer-events: none; transition: opacity .4s; white-space: nowrap; }
#boot { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(18,16,14,.94); transition: opacity .45s, background .3s; }
#boot.soft { background: rgba(18,16,14,.55); }
#boot.off { opacity: 0; pointer-events: none; }
#boot .bx { min-width: 240px; max-width: 80vw; padding: 18px 22px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
#boot .t { font-size: 14px; margin-bottom: 10px; } #boot .n { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 10px; }
#boot .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; } #boot .bar i { display: block; height: 100%; width: 0; background: currentColor; transition: width .15s; }
#loading { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; pointer-events: none; transition: opacity .3s; }

.spot::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: rgba(255, 252, 245, 0.35); border: 2px solid rgba(255, 252, 245, 0.95);
  box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .15s; }
.spot:hover::before { transform: scale(1.15); }
.spot span { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); white-space: nowrap; pointer-events: none; }

  border-radius: 12px; padding: 8px 13px; font-size: 13.5px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#toast.on { opacity: 1; } #toast span { color: var(--muted); }
canvas#c.hot { cursor: pointer; }
.ibtn { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: inline-grid; place-items: center;
  cursor: pointer; padding: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex: none; }
.ibtn svg { width: 18px; height: 18px; }
.ibtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.card { position: relative; padding-right: 40px; }
.card .fold { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.card .fold svg { width: 16px; height: 16px; }
#unfold { display: none; opacity: .55; width: 30px; height: 30px; }
body.folded .card { display: none; } body.folded #unfold { display: inline-grid; }
.tr { display: flex; gap: 8px; align-items: center; pointer-events: none; }
/* «скрыть всё»: остаётся только эта же кнопка на своём месте, полупрозрачным глазком */
#hideui .on { display: none; }
body.clean #hideui .on { display: block; } body.clean #hideui .off { display: none; }
body.clean #hideui { opacity: .45; }
body.clean .top .card, body.clean #unfold, body.clean .top .tr > a, body.clean .bottom, body.clean #hint, body.clean #loading { visibility: hidden !important; }
@media (max-width: 520px) { .card p { display: none; } .card h1 { font-size: 14px; margin: 0; } }

<script type="module">
import * as THREE from 'three';

const CONFLICT = {};

  'Буфет ящик 2 верх': 'Буфет, ящик', 'Буфет ящик 2 низ': 'Буфет, нижний ящик', 'Буфет ящик 1 верх внутр 1': 'Буфет, внутренний ящик',
  'Верх 1 верх': 'Навесной, верхняя дверца', 'Верх 1 низ': 'Навесной, дверца', 'Верх 2 верх': 'Навесной, верхняя дверца', 'Верх 2 низ': 'Навесной, дверца',
  'Верх 3 верх': 'Навесной, верхняя дверца', 'Верх 3 низ': 'Навесной, дверца', 'Духовка': 'Духовка', 'Мойка лев': 'Мойка, левая дверь', 'Мойка прав': 'Мойка, правая дверь',
  'Морозильник': 'Морозильник', 'Холодильник': 'Холодильник', 'ПММ': 'Посудомойка', 'Пенал антресоль 1': 'Антресоль пенала', 'Пенал антресоль 2': 'Антресоль пенала',
  'Пенал над духовкой': 'Шкаф над духовкой', 'Пенал ящик': 'Ящик под духовкой', 'Шкаф антресоль лев': 'Антресоль, левая', 'Шкаф антресоль прав': 'Антресоль, правая',

  'Остров А1': 'Остров, ящик', 'Остров А2': 'Остров, ящик', 'Остров А3': 'Остров, ящик', 'Остров Б1': 'Остров, ящик', 'Остров Б2': 'Остров, ящик', 'Остров Б3': 'Остров, ящик',
  'Остров А1 внутр 1': 'Остров, внутренний ящик', 'Остров А2 внутр 1': 'Остров, внутренний ящик', 'Остров А3 внутр 1': 'Остров, внутренний ящик',
  'Остров Б1 внутр 1': 'Остров, внутренний ящик', 'Остров Б2 внутр 1': 'Остров, внутренний ящик', 'Остров Б3 внутр 1': 'Остров, внутренний ящик',
  'Витрина низ': 'Витрина, нижняя дверь', 'Микроволновка': 'Микроволновка', 'Витрина верх': 'Витрина, верхняя дверь',
};
// Blender-направление → направление в сцене three (сфера с текстурой equirect, центр кадра = +Y Blender)
const b2t = (d) => new THREE.Vector3(-d[1], d[2], -d[0]);
const t2uv = (v) => { const dx = -v.z, dy = -v.x, dz = v.y, r = Math.hypot(dx, dy, dz) || 1;
  return [0.5 + Math.atan2(dx, dy) / (2 * Math.PI), 0.5 - Math.asin(Math.max(-1, Math.min(1, dz / r))) / Math.PI]; };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1000);
const geo = new THREE.SphereGeometry(500, 96, 48); geo.scale(-1, 1, 1);
const MAXT = renderer.capabilities.maxTextureSize;
// 8K-панорама — на компьютере с поддержкой текстур 8192; на телефоне и слабых видеокартах — 4K
const HI = MAXT >= 8192 && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && (navigator.deviceMemory || 8) >= 4;
const mkMat = () => new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, depthTest: false });
const layers = [new THREE.Mesh(geo, mkMat()), new THREE.Mesh(geo, mkMat())];
layers.forEach((m, i) => { m.renderOrder = i; scene.add(m); });

const loading = document.getElementById('loading'); let pending = 0;
const busy = (d) => { pending += d; loading.style.opacity = pending > 0 ? 1 : 0; };
// фоновая догрузка: файлы остальных точек скачиваются заранее в память (blob), чтобы переход был без ожидания
const PRE = new Map();                            // url → Promise<objectURL|null>
function prefetch(src) {
  if (!PRE.has(src)) PRE.set(src, fetch(src).then(r => r.ok ? r.blob() : null).then(b => b ? URL.createObjectURL(b) : null).catch(() => null));
  return PRE.get(src);
}
async function loadImg(src) {
  busy(1);
  const u = PRE.has(src) ? ((await PRE.get(src)) || src) : src;
  return new Promise((res, rej) => { const img = new Image(); img.decoding = 'async';
    img.onload = () => { busy(-1); res(img); }; img.onerror = () => { busy(-1); rej(new Error(src)); }; img.src = u; });
}
function mkTex(src) {
  const t = new THREE.Texture(src); t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.needsUpdate = true; return t;
}
const cache = new Map();
const PROG = {};                                 // доля загрузки больших панорам (по байтам)
function fetchImg(src, key) {
  busy(1); PROG[key] = 0;
  return fetch(src).then(async r => {
    if (!r.ok) throw new Error(src);
    const total = +r.headers.get('content-length') || 0;
    let blob;
    if (r.body && total) {
      const rd = r.body.getReader(), parts = []; let got = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; PROG[key] = Math.min(0.99, got / total); }
      blob = new Blob(parts);
    } else blob = await r.blob();
    const img = new Image(); img.decoding = 'async'; img.src = URL.createObjectURL(blob); await img.decode();
    PROG[key] = 1; busy(-1); return img;
  }).catch(e => { busy(-1); PROG[key] = 1; return loadImg(src); });
}
function loadPano(key) {
  if (!cache.has(key)) cache.set(key, fetchImg('pano/' + key + (HI ? '' : '_4k') + '.jpg', key).then(img => {
    let src = img;
    if (img.width > MAXT) { const cv = document.createElement('canvas'); cv.width = MAXT; cv.height = MAXT / 2; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); src = cv; }
    return mkTex(src);
  }));

}

// ---- заплатки (каждая дверца отдельно) ----
let META = null; const GBY = {};               // id группы → {id, movs, label}
const opened = new Set();                       // id открытых групп (общие для всех точек)
const ids = {};                                 // карта фасадов точки: {w, h, data}
const patches = {};                             // pk_gid → {mesh, alpha, px, ready}
const metaP = fetch('pano/parts/parts.json').then(r => r.json()).then(m => { META = m; m.groups.forEach(g => { GBY[g.id] = g; }); return m; }).catch(() => null);
function loadIds(pk) {
  if (!ids[pk]) ids[pk] = loadImg('pano/parts/' + pk + '_ids.png').then(img => {
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; const c = cv.getContext('2d', { willReadFrequently: true });
    c.drawImage(img, 0, 0); return { w: img.width, h: img.height, data: c.getImageData(0, 0, img.width, img.height).data };
  }).catch(() => null);

}
// заплатка рисуется шейдером: цвет + маска из WebP, глубина (расстояние до поверхности) из *_d.png → gl_FragDepth,
// чтобы открытая дверца одного шкафа правильно перекрывала внутренность соседнего
const PATCH_VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
// плавное открывание без лишних кадров: заплатка проявляется по глубине — сначала дальнее (нутро шкафа),
// потом ближнее (открытая дверца/ящик «выходит» на зрителя); при закрытии — в обратном порядке
const PATCH_FS = `uniform sampler2D map; uniform sampler2D dmap; uniform float op; uniform vec2 dr; uniform float zb; varying vec2 vUv;
void main() {
  vec4 c = texture2D(map, vUv);
  vec2 dd = texture2D(dmap, vUv).rg; float d = (floor(dd.r * 255.0 + 0.5) + dd.g) / 255.0;
  float dn = d > 0.999 ? 1.0 : clamp((d - dr.x) / max(dr.y - dr.x, 1e-4), 0.0, 1.0);
  const float S = 1.0;   // ширина «фронта» проявления: шире — меньше ряби по глубине
  float w = clamp((op * (1.0 + S) - (1.0 - dn)) / S, 0.0, 1.0);
  float a = c.a * w * w * (3.0 - 2.0 * w); if (a < 0.02) discard;

    bootEl.classList.toggle('soft', booted); bootEl.classList.remove('off'); };
  clearTimeout(bootTimer);
  if (!booted) { setBoot(0); on(); } else bootTimer = setTimeout(on, 250);
}
// после первой точки: остальные — по удалённости. На компьютере готовим целиком (текстуры в видеопамяти),
// на телефоне только скачиваем файлы в память, чтобы не упереться в видеопамять
let warmStarted = false;
async function warmAll() {
  if (warmStarted) return; warmStarted = true;
  await metaP; if (!META) return;
  const full = HI || (navigator.deviceMemory || 4) >= 8;
  const rest = PTS.filter(q => q !== cur).sort((a, b) => Math.hypot(a.p[0] - cur.p[0], a.p[1] - cur.p[1]) - Math.hypot(b.p[0] - cur.p[0], b.p[1] - cur.p[1]));
  for (const q of rest) {
    const urls = ['pano/parts/' + q.id + '_ids.png'];
    Object.values(META.parts[q.id] || {}).forEach(i => { urls.push('pano/parts/' + i.file); if (i.depth) urls.push('pano/parts/' + i.depth); if (i.pick) urls.push('pano/parts/' + i.pick); });
    for (let k = 0; k < urls.length; k += 6) await Promise.all(urls.slice(k, k + 6).map(prefetch));
    if (full) await preparePoint(q, true);
  }
}
async function show(pt, md, keepView) {
  await preparePoint(pt);
  const tex = await loadPano(pt.id + '_closed' + floor);
  const next = 1 - top, m = layers[next];
  m.material.map = tex; m.material.needsUpdate = true; m.material.opacity = 0; m.renderOrder = 2; layers[top].renderOrder = 1;
  if (!keepView) aimAt(pt);
  const samePt = pt === cur;
  fade = { m, from: layers[top], t0: performance.now(), dur: keepView ? 450 : 600 };
  top = next; cur = pt; mode = md; buildSpots(); ui();
  idsNow = null; loadIds(pt.id).then(x => { if (cur === pt) idsNow = x; });
  if (md === 'single') applyOpened(pt.id, !samePt); else hideAllPatches();
  setTimeout(() => {                                   // фоновая подгрузка
    metaP.then(() => { if (META && META.parts[pt.id]) Object.keys(META.parts[pt.id]).forEach(gid => loadPatch(pt.id, gid)); });
    PTS.forEach(q => loadPano(q.id + '_closed' + floor));
    warmAll();
  }, 400);
  setTimeout(() => { if (cur === pt) animPrefetch(pt.id); }, 2500);
}
const ptsEl = document.getElementById('pts');
PTS.forEach(pt => {
  const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = '<span class="dot"></span>' + pt.name;
  b.onclick = () => { if (pt !== cur) show(pt, mode, false); }; pt.btn = b; ptsEl.appendChild(b);
});
const stC = document.getElementById('stClosed'), stO = document.getElementById('stOpen');
stC.onclick = () => { opened.clear(); hideAllPatches(); ui(); };
stO.onclick = () => { if (!META) return; opened.clear(); META.groups.forEach(g => { if (!g.combo && !g.inv) opened.add(g.id); }); refresh(cur.id, false); ui(); };
function ui() {
  PTS.forEach(p => p.btn.setAttribute('aria-pressed', p === cur));
  const nAll = META ? META.groups.filter(g => !g.combo && !g.inv).length : -1; stO.setAttribute('aria-pressed', opened.size === nAll); stC.setAttribute('aria-pressed', opened.size === 0);
}

// кружки-переходы на полу
const spotsEl = document.getElementById('spots'); let spots = [];
function buildSpots() {
  spotsEl.innerHTML = ''; spots = [];
  PTS.forEach(q => {
    if (q === cur) return;
    const d = b2t([q.p[0] - cur.p[0], q.p[1] - cur.p[1], 0.02 - cur.p[2]]).normalize().multiplyScalar(400);
    const el = document.createElement('button'); el.className = 'spot'; el.setAttribute('aria-label', 'Перейти: ' + q.name);
    el.innerHTML = '<span>' + q.name + '</span>'; el.onclick = () => show(q, mode, false);
    spotsEl.appendChild(el); spots.push({ el, v: d });
  });
}

// ---- управление: перетаскивание, щипок, нажатие ----
const hint = document.getElementById('hint');
let drag = null; const ptrs = new Map(); let pinch0 = 0, fov0 = 70, tap = null;
const dirAt = (cx, cy) => new THREE.Vector3((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1, 0.5).unproject(camera).normalize();
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, lon, lat }; tap = { x: e.clientX, y: e.clientY, t: performance.now() }; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); fov0 = fov; drag = null; tap = null; }
  hint.style.opacity = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) {                       // наведение мышью: подсветить курсором кликабельное
    if (e.pointerType === 'mouse' && mode === 'single') { const [u, v] = t2uv(dirAt(e.clientX, e.clientY)); canvas.classList.toggle('hot', pick(u, v) > 0); }
    return;
  }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); fov = THREE.MathUtils.clamp(fov0 * pinch0 / d, 30, 95); return; }
  if (!drag) return;
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) tap = null;
  const k = (fov / 70) * 0.0045;
  lon = drag.lon - (e.clientX - drag.x) * k;
  lat = THREE.MathUtils.clamp(drag.lat + (e.clientY - drag.y) * k, -1.45, 1.45);
});
const up = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) {
    if (tap && e.type === 'pointerup' && performance.now() - tap.t < 600) onTap(e.clientX, e.clientY);
    drag = null; tap = null;
  }
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
function onTap(cx, cy) {
  const [u, v] = t2uv(dirAt(cx, cy)); const gid = pick(u, v);
  if (!gid) return;
  if (mode === 'all') { toastEl.innerHTML = '<span>Нажмите «Закрыть всё», чтобы открывать по одной</span>'; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1800); return; }
  setGroup(gid, !opened.has(gid)).then(ui); ui();
}
canvas.addEventListener('wheel', e => { e.preventDefault(); fov = THREE.MathUtils.clamp(fov * Math.exp(e.deltaY * 0.0012), 30, 95); hint.style.opacity = 0; }, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') lon -= 0.08; if (e.key === 'ArrowRight') lon += 0.08;
  if (e.key === 'ArrowUp') lat = Math.min(1.45, lat + 0.06); if (e.key === 'ArrowDown') lat = Math.max(-1.45, lat - 0.06);
});
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; if (w < h) fov = Math.max(fov, 80); }
addEventListener('resize', resize); resize();

const tmp = new THREE.Vector3();
function frame(now) {
  if (fade) {
    const k = Math.min(1, (now - fade.t0) / fade.dur); fade.m.material.opacity = k * k * (3 - 2 * k);
    if (k >= 1) { fade.from.material.opacity = 0; fade.m.material.opacity = 1; fade = null; }
  }
  stepAnims(now);
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i], k = Math.max(0, Math.min(1, (now - t.t0) / t.dur)), s = k * k * (3 - 2 * k);
    t.m.opacity = t.from + (t.to - t.from) * s; if (k >= 1) { tweens.splice(i, 1); t.end && t.end(); }
  }
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.lookAt(Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon));
  renderer.render(scene, camera);
  const w = innerWidth, h = innerHeight;
  for (const s of spots) {
    tmp.copy(s.v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    s.el.style.display = vis ? 'block' : 'none';
    if (vis) { s.el.style.left = ((tmp.x + 1) / 2 * w) + 'px'; s.el.style.top = ((1 - tmp.y) / 2 * h) + 'px'; }
  }
  requestAnimationFrame(frame);
}
// свернуть описание / скрыть все кнопки (запоминается в этом браузере)
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
if (store.get('lipki_fold') === '1') document.body.classList.add('folded');
document.getElementById('fold').onclick = () => { document.body.classList.add('folded'); store.set('lipki_fold', '1'); };
document.getElementById('unfold').onclick = () => { document.body.classList.remove('folded'); store.set('lipki_fold', '0'); };
const hideBtn = document.getElementById('hideui');
hideBtn.onclick = () => { const c = document.body.classList.toggle('clean'); hideBtn.setAttribute('aria-pressed', c); hideBtn.setAttribute('aria-label', c ? 'Показать кнопки' : 'Скрыть кнопки'); };
window.__pano = { pick, setGroup, opened, patches, shownSet, AREC, get ANIM() { return ANIM; }, get META() { return META; }, get cur() { return cur; }, t2uv, dirAt, aim(x, y, z, f) { aimAt({ p: cur.p, look: [x, y, z] }); if (f) fov = f; } };
const floorsEl = document.getElementById('floors');
function buildFloors() {
  const F = (META && META.floors) || []; floorsEl.innerHTML = ''; floorsEl.style.display = F.length > 1 ? '' : 'none';
  const lab = document.createElement('span'); lab.textContent = 'Пол'; lab.style.cssText = 'font-size:12.5px;color:var(--muted);padding:7px 6px 7px 10px'; floorsEl.appendChild(lab);
  F.forEach(([suf, name]) => {
    const b = document.createElement('button'); b.textContent = name; b.setAttribute('aria-pressed', suf === floor);
    b.onclick = () => { if (suf === floor) return; floor = suf; store.set('lipki_floor', suf); buildFloors(); show(cur, mode, true); };
    floorsEl.appendChild(b);
  });
}
metaP.then(() => { const sv = store.get('lipki_floor'); if (sv !== null && META && (META.floors || []).some(f => f[0] === sv)) floor = sv; buildFloors(); })
  .then(() => show(PTS[0], 'single', false)).then(() => setTimeout(() => hint.style.opacity = 0, 3500));
requestAnimationFrame(frame);
</script>
